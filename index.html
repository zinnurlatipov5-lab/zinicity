<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ZINI CITY</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#9ed9ff;font-family:'Segoe UI',system-ui,sans-serif;color:#10202e;touch-action:none;overscroll-behavior:none}
canvas{touch-action:none;display:block}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 58%,rgba(10,16,40,.28) 100%)}
#topbar{position:absolute;top:10px;left:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:70vw}
.chip{background:rgba(10,20,40,.75);color:#eaf4ff;border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:6px 12px;font-size:13px;font-weight:800}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);opacity:.85}
#cross:before,#cross:after{content:'';position:absolute;background:#fff;box-shadow:0 0 3px #000}
#cross:before{left:8px;top:0;width:2px;height:18px}
#cross:after{top:8px;left:0;width:18px;height:2px}
#hotbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto;max-width:96vw;overflow-x:auto}
.hchip{background:rgba(12,22,44,.85);color:#fff;border:2px solid rgba(255,255,255,.25);border-radius:12px;padding:7px 11px;font-size:12px;font-weight:800;cursor:pointer;min-width:76px;text-align:center;flex-shrink:0}
.hchip.on{border-color:#7ef2ff;box-shadow:0 0 12px rgba(126,242,255,.6)}
.hchip .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid rgba(255,255,255,.4)}
.hchip small{display:block;font-size:10px;opacity:.75;font-weight:700}
.abtn{position:absolute;width:60px;height:60px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(16,28,56,.8);color:#fff;font-size:24px;pointer-events:auto;cursor:pointer;touch-action:none}
#actBtn{right:20px;bottom:28px;width:80px;height:80px;font-size:32px}
#modeBtn{right:28px;bottom:124px;width:54px;height:54px;font-size:21px}
#jumpBtn{right:114px;bottom:34px;width:54px;height:54px;font-size:21px}
#rotBtn{right:114px;bottom:106px;width:54px;height:54px;font-size:19px}
#mapBtn{position:absolute;top:10px;right:14px;width:52px;height:52px;border-radius:14px;border:2px solid rgba(255,255,255,.5);background:rgba(16,28,56,.85);color:#fff;font-size:24px;pointer-events:auto;cursor:pointer;touch-action:none}
#joyL{position:absolute;left:26px;bottom:26px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);pointer-events:none}
#knob{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.35);left:34px;top:34px}
#tip{position:absolute;left:12px;bottom:14px;font-size:11px;font-weight:700;color:#fff;background:rgba(10,20,40,.6);border-radius:10px;padding:6px 10px;max-width:44vw;line-height:1.5}
body.touch #tip{display:none}
#lockHint{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(8,14,32,.55);color:#fff;font-size:18px;font-weight:900;pointer-events:auto;cursor:pointer}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tst{background:rgba(14,26,54,.92);color:#eaf4ff;border:1px solid rgba(126,242,255,.5);border-radius:12px;padding:7px 14px;font-size:12.5px;font-weight:800;animation:tt 2.2s ease forwards;max-width:86vw;text-align:center}
@keyframes tt{0%{opacity:0;transform:translateY(8px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#dlg{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(6,12,28,.45);pointer-events:auto;padding-bottom:8vh}
#dlgBox{background:#12244a;border:2px solid #3d5a8a;border-radius:18px;padding:16px;max-width:90vw;max-height:60vh;overflow:auto}
#dlgName{color:#7ef2ff;font-weight:900;font-size:14px;margin-bottom:8px}
#dlgText{color:#eaf4ff;font-size:14px;line-height:1.5;margin-bottom:12px}
#dlgBtns{display:flex;flex-direction:column;gap:8px}
.dbtn{background:#2f6fc0;color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:900;font-size:13px;cursor:pointer;text-align:left}
.dbtn.alt{background:#243a63}
.dbtn.good{background:#2e9e5b}
.dbtn:disabled{opacity:.45;cursor:default}
#mapWrap{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(6,12,28,.75);pointer-events:auto}
#mapPanel{background:#10203c;border:2px solid #3d5a8a;border-radius:18px;padding:14px;max-width:92vw}
#mapTitle{color:#d8f6ff;font-weight:900;font-size:15px;text-align:center;margin-bottom:8px}
#mapCv{display:block;border-radius:10px;max-width:86vw;max-height:60vh}
#mapClose{display:block;margin:10px auto 0;background:#2f6fc0;color:#fff;border:0;border-radius:10px;padding:8px 22px;font-weight:900;font-size:14px}
</style>
</head>
<body>
<div id="vignette"></div>
<div id="ui">
 <div id="topbar">
  <div class="chip" id="nick">Новосёл</div>
  <div class="chip" id="moneyChip">💰 500 ₽</div>
  <div class="chip" id="dayChip">☀ 12:00</div>
  <div class="chip" id="jobChip" style="display:none">📦 0/5 · 2:00</div>
  <div class="chip" id="modeChip">🔨 СТРОЙКА</div>
 </div>
 <div id="cross"></div>
 <div id="hint"></div>
 <div id="hotbar"></div>
 <div id="tip">WASD — ходьба · мышь — обзор · клик/E — действие · Q — режим · R — повернуть · M — карта</div>
</div>
<div id="joyL"><div id="knob"></div></div>
<button class="abtn" id="jumpBtn">⬆</button>
<button class="abtn" id="modeBtn">⚒</button>
<button class="abtn" id="rotBtn">⟳</button>
<button class="abtn" id="actBtn">🔨</button>
<button id="mapBtn">🗺</button>
<div id="toast"></div>
<div id="lockHint">Клик — играть 🖱</div>
<div id="dlg">
 <div id="dlgBox">
  <div id="dlgName">БИРЖА ТРУДА · Тимофей</div>
  <div id="dlgText"></div>
  <div id="dlgBtns"></div>
 </div>
</div>
<div id="mapWrap">
 <div id="mapPanel">
  <div id="mapTitle">КАРТА ZINI CITY</div>
  <canvas id="mapCv" width="340" height="340"></canvas>
  <button id="mapClose">Закрыть</button>
 </div>
</div>
<script>
'use strict';
/* ===== ZINI CITY — Спринт 9: автобус, порт «Восточный», мастер Борис ===== */
const $=id=>document.getElementById(id);
const IS_TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(IS_TOUCH)document.body.classList.add('touch');
function toast(t){const d=document.createElement('div');d.className='tst';d.textContent=t;$('toast').appendChild(d);setTimeout(()=>d.remove(),2200);}
let errToasted=false;
function errToast(m){if(errToasted)return;errToasted=true;try{toast('Сбой: '+m+' — напиши мне этот текст');}catch(_){}}
window.addEventListener('error',e=>errToast(e.message));
let ACX=null;
function ac(){try{if(!ACX)ACX=new (window.AudioContext||window.webkitAudioContext)();if(ACX.state==='suspended')ACX.resume();return ACX;}catch(e){return null;}}
function sfx(fr,du,ty,vo){const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.value=fr;g.gain.setValueAtTime(vo,a.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+du);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+du);}catch(e){}}
function thunk(){sfx(140,0.09,'square',0.05);sfx(90,0.12,'sine',0.04);}
function crack(){sfx(260,0.06,'square',0.04);setTimeout(()=>sfx(180,0.09,'square',0.03),40);}
function coin(){sfx(880,0.07,'sine',0.05);setTimeout(()=>sfx(1320,0.1,'sine',0.05),70);}
function chopSfx(){sfx(110,0.14,'square',0.06);setTimeout(()=>sfx(70,0.16,'sine',0.05),60);}
function mineSfx(){sfx(180,0.08,'square',0.05);setTimeout(()=>sfx(120,0.1,'square',0.04),50);}
function honk(){sfx(420,0.25,'square',0.06);setTimeout(()=>sfx(390,0.2,'square',0.05),260);}
function creak(){sfx(240,0.3,'sawtooth',0.02);}
window.addEventListener('pointerdown',()=>ac());
let money=parseInt(localStorage.getItem('mg_money')||'500',10);
function setMoney(v){money=v;localStorage.setItem('mg_money',String(v));$('moneyChip').textContent='💰 '+money+' ₽';}
setMoney(money);
let NICK=localStorage.getItem('mg_nick');
if(!NICK){const v=prompt('Как тебя звать в ZINI CITY?','')||'';NICK=(v.trim()||'Новосёл').slice(0,12);localStorage.setItem('mg_nick',NICK);}
$('nick').textContent=NICK;
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xbfe0f5,90,300);
const camera=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,0.1,500);
scene.add(camera);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(IS_TOUCH?1.5:2,devicePixelRatio||1));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const hemi=new THREE.HemisphereLight(0xe8f4ff,0x6a8a52,0.75);
scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2d8,1.05);
sun.position.set(60,90,30);
sun.castShadow=true;
sun.shadow.mapSize.set(IS_TOUCH?1024:2048,IS_TOUCH?1024:2048);
sun.shadow.camera.left=-110;sun.shadow.camera.right=110;
sun.shadow.camera.top=110;sun.shadow.camera.bottom=-110;
sun.shadow.camera.far=320;
scene.add(sun);
const moonLight=new THREE.DirectionalLight(0x8899cc,0);
moonLight.position.set(-60,80,-40);
scene.add(moonLight);
(function(){
 const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
 const gr=g.createRadialGradient(64,64,4,64,64,64);
 gr.addColorStop(0,'rgba(255,244,200,.9)');gr.addColorStop(0.4,'rgba(255,230,160,.25)');gr.addColorStop(1,'rgba(255,230,160,0)');
 g.fillStyle=gr;g.fillRect(0,0,128,128);
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));
 sp.scale.set(60,60,1);sp.position.set(200,260,100);scene.add(sp);
})();
const moon=(function(){
 const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
 const gr=g.createRadialGradient(64,64,20,64,64,64);
 gr.addColorStop(0,'rgba(240,245,255,1)');gr.addColorStop(0.5,'rgba(220,230,250,.9)');gr.addColorStop(0.62,'rgba(200,215,245,.35)');gr.addColorStop(1,'rgba(200,215,245,0)');
 g.fillStyle=gr;g.fillRect(0,0,128,128);
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false,opacity:0}));
 sp.scale.set(26,26,1);sp.position.set(-160,150,-120);scene.add(sp);return sp;
})();
const stars=[];
(function(){
 const c=document.createElement('canvas');c.width=c.height=32;const g=c.getContext('2d');
 const gr=g.createRadialGradient(16,16,1,16,16,15);
 gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.5,'rgba(220,230,255,.5)');gr.addColorStop(1,'rgba(220,230,255,0)');
 g.fillStyle=gr;g.fillRect(0,0,32,32);
 const map=new THREE.CanvasTexture(c);
 for(let i=0;i<44;i++){
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map,transparent:true,depthWrite:false,opacity:0}));
  const a=Math.random()*Math.PI*2,r=140+Math.random()*120;
  sp.position.set(Math.cos(a)*r,70+Math.random()*130,Math.sin(a)*r);
  const s2=1+Math.random()*2;sp.scale.set(s2,s2,1);
  scene.add(sp);stars.push(sp);
 }
})();
const solids=[],statics=[],pickables=[],pieces=[];
function makeTex(size,draw){
 const c=document.createElement('canvas');c.width=c.height=size;
 const g=c.getContext('2d');draw(g,size);
 const t=new THREE.CanvasTexture(c);t.anisotropy=4;
 return t;
}
function noise(g,s,n,a){
 for(let i=0;i<n;i++){g.fillStyle='rgba('+(Math.random()<0.5?'0,0,0':'255,255,255')+','+a+')';g.fillRect(Math.random()*s,Math.random()*s,2,2);}
}
function brickFaceMake(base){
 return makeTex(384,(g,s)=>{
  g.fillStyle='#d6cfc2';g.fillRect(0,0,s,s);
  for(let row=0;row<6;row++){
   const off=(row%2)*32;
   for(let col=-1;col<7;col++){
    const x=col*64+off,y=row*64;
    const v=(Math.random()*36-18)|0;
    const rr=Math.max(0,Math.min(255,parseInt(base.slice(1,3),16)+v));
    const gg=Math.max(0,Math.min(255,parseInt(base.slice(3,5),16)+v));
    const bb=Math.max(0,Math.min(255,parseInt(base.slice(5,7),16)+v));
    const grad=g.createLinearGradient(x,y,x,y+64);
    grad.addColorStop(0,'rgb('+rr+','+gg+','+bb+')');
    grad.addColorStop(0.55,'rgb('+Math.max(0,rr-22)+','+Math.max(0,gg-20)+','+Math.max(0,bb-16)+')');
    grad.addColorStop(1,'rgb('+rr+','+gg+','+bb+')');
    g.fillStyle=grad;g.fillRect(x+3,y+4,58,56);
    g.fillStyle='rgba(255,255,255,.1)';g.fillRect(x+3,y+4,58,3);
    g.fillStyle='rgba(0,0,0,.18)';g.fillRect(x+3,y+56,58,4);
    for(let k=0;k<18;k++){
     g.fillStyle='rgba('+(Math.random()<0.5?'60,20,12':'230,150,110')+','+(0.05+Math.random()*0.13).toFixed(2)+')';
     g.fillRect(x+3+Math.random()*56,y+4+Math.random()*52,3+Math.random()*6,2+Math.random()*4);
    }
   }
  }
  g.strokeStyle='rgba(90,80,70,.4)';g.lineWidth=1.5;
  for(let i=0;i<7;i++){
   const x=Math.random()*s,y=Math.random()*s;
   g.beginPath();g.moveTo(x,y);g.lineTo(x+(Math.random()-0.5)*22,y+(Math.random()-0.5)*22);g.stroke();
  }
  noise(g,s,300,0.06);
 });
}
function brickEndMake(base){
 return makeTex(128,(g,s)=>{
  g.fillStyle='#d6cfc2';g.fillRect(0,0,s,s);
  g.fillStyle=base;g.fillRect(26,22,s-52,s-44);
  const gr=g.createLinearGradient(0,0,0,s);
  gr.addColorStop(0,'rgba(255,255,255,.15)');gr.addColorStop(1,'rgba(0,0,0,.25)');
  g.fillStyle=gr;g.fillRect(26,22,s-52,s-44);
  noise(g,s,110,0.1);
 });
}
const brickBases=['#a8442e','#b0512f','#99402b'];
const brickMatsList=brickBases.map(base=>({
 face:new THREE.MeshStandardMaterial({map:brickFaceMake(base),roughness:0.92}),
 end:new THREE.MeshStandardMaterial({map:brickEndMake(base),roughness:0.92})
}));
const brickBump=makeTex(256,(g,s)=>{
 g.fillStyle='#141414';g.fillRect(0,0,s,s);
 for(let row=0;row<4;row++){
  const off=(row%2)*32;
  for(let col=-1;col<5;col++){
   g.fillStyle='rgb(225,225,225)';
   g.fillRect(col*64+off+4,row*64+5,56,54);
  }
 }
 noise(g,s,180,0.16);
});
function plankFaceMake(){
 return makeTex(384,(g,s)=>{
  g.fillStyle='#8a5f36';g.fillRect(0,0,s,s);
  const kx=s*(0.2+Math.random()*0.6),ky=s*(0.25+Math.random()*0.5);
  for(let k=0;k<44;k++){
   g.strokeStyle='rgba(60,38,18,'+(0.12+Math.random()*0.3).toFixed(2)+')';
   g.lineWidth=1+Math.random()*2;
   const gx=Math.random()*s;
   g.beginPath();g.moveTo(gx,4);g.bezierCurveTo(gx+7,s*0.3,gx-7,s*0.7,gx+3,s-4);g.stroke();
  }
  for(let k=0;k<26;k++){
   g.strokeStyle='rgba(190,150,110,'+(0.05+Math.random()*0.09).toFixed(2)+')';
   g.lineWidth=1;
   const gx=Math.random()*s;
   g.beginPath();g.moveTo(gx,2);g.lineTo(gx+2,s-2);g.stroke();
  }
  g.fillStyle='rgba(255,235,200,.12)';g.fillRect(0,0,s,5);
  g.fillStyle='rgba(40,24,10,.45)';g.fillRect(0,s-6,s,6);
  noise(g,s,190,0.07);
  if(Math.random()<0.8){
   g.strokeStyle='rgba(50,30,14,.6)';g.lineWidth=2;
   g.beginPath();g.ellipse(kx,ky,7+Math.random()*4,10+Math.random()*5,Math.random()*3,0,7);g.stroke();
   g.beginPath();g.ellipse(kx,ky,3.5,5,Math.random(),0,7);g.stroke();
   for(let r=9;r<22;r+=4){
    g.strokeStyle='rgba(60,38,18,.3)';g.lineWidth=1.5;
    g.beginPath();g.ellipse(kx,ky,r*0.8,r*1.15,Math.random(),0,7);g.stroke();
   }
  }
 });
}
const plankSideTex=makeTex(256,(g,s)=>{
 g.fillStyle='#7a5330';g.fillRect(0,0,s,s);
 for(let k=0;k<44;k++){
  g.strokeStyle='rgba(52,32,15,'+(0.15+Math.random()*0.3).toFixed(2)+')';
  g.lineWidth=1+Math.random();
  const gy=Math.random()*s;
  g.beginPath();g.moveTo(0,gy);g.lineTo(s,gy+(Math.random()-0.5)*6);g.stroke();
 }
 noise(g,s,110,0.08);
});
const endGrainTex=makeTex(64,(g,s)=>{
 g.fillStyle='#c8a878';g.fillRect(0,0,s,s);
 for(let r=3;r<s/2;r+=3+Math.random()*3){
  g.strokeStyle='rgba(110,70,35,'+(0.3+Math.random()*0.3).toFixed(2)+')';
  g.lineWidth=1.5;
  g.beginPath();g.arc(s/2,s/2,r,0,7);g.stroke();
 }
 g.strokeStyle='rgba(50,30,14,.7)';g.lineWidth=3;g.strokeRect(1,1,s-2,s-2);
});
const plankBump=makeTex(256,(g,s)=>{
 g.fillStyle='#c8c8c8';g.fillRect(0,0,s,s);
 for(let k=0;k<34;k++){
  g.strokeStyle='rgba(40,40,40,'+(0.25+Math.random()*0.35).toFixed(2)+')';
  g.lineWidth=1+Math.random()*2;
  const gx=Math.random()*s;
  g.beginPath();g.moveTo(gx,2);g.bezierCurveTo(gx+5,s*0.3,gx-5,s*0.7,gx+2,s-2);g.stroke();
 }
 noise(g,s,140,0.12);
});
const glassStreak=makeTex(256,(g,s)=>{
 g.fillStyle='rgba(255,255,255,0)';g.fillRect(0,0,s,s);
 g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=10;
 g.beginPath();g.moveTo(20,s-24);g.lineTo(s-50,30);g.stroke();
 g.strokeStyle='rgba(255,255,255,.28)';g.lineWidth=4;
 g.beginPath();g.moveTo(44,s-16);g.lineTo(s-26,48);g.stroke();
 g.strokeStyle='rgba(255,255,255,.14)';g.lineWidth=2;
 for(let i=0;i<8;i++){
  const x=Math.random()*s,y=Math.random()*s;
  g.beginPath();g.moveTo(x,y);g.lineTo(x+14,y-20);g.stroke();
 }
});
const frameTex=makeTex(128,(g,s)=>{
 g.fillStyle='#f5f0e6';g.fillRect(0,0,s,s);
 for(let k=0;k<14;k++){
  g.strokeStyle='rgba(120,90,50,'+(0.1+Math.random()*0.22).toFixed(2)+')';
  g.lineWidth=1.5;
  const gx=Math.random()*s;
  g.beginPath();g.moveTo(gx,0);g.lineTo(gx+2,s);g.stroke();
 }
 g.fillStyle='rgba(90,60,30,.35)';g.fillRect(0,s-8,s,8);
});
const frameBump=makeTex(128,(g,s)=>{
 g.fillStyle='#b8b8b8';g.fillRect(0,0,s,s);noise(g,s,100,0.12);

function roundedBox(w,h,d,r){
 const k=w+'_'+h+'_'+d+'_'+r;
 if(geoCache[k])return geoCache[k];
 r=Math.min(r,w/2-0.01,h/2-0.01,d/2-0.01);
 const s=new THREE.Shape(),x=-w/2,y=-h/2;
 s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);
 s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
 s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);
 s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);
 const geo=new THREE.ExtrudeGeometry(s,{depth:d-2*r,bevelEnabled:true,bevelThickness:r,bevelSize:r,bevelSegments:2,curveSegments:4});
 geo.center();geoCache[k]=geo;return geo;
}

function updateNeighbors(dt,ts){
 for(const n of neighbors){
  const near=Math.hypot(n.g.position.x-player.x,n.g.position.z-player.z);
  if(near>2.6){
   n.t+=n.dir*n.speed*dt/(Math.hypot(n.b.x-n.a.x,n.b.z-n.a.z)||1);
   if(n.t>1){n.t=1;n.dir=-1;}
   if(n.t<0){n.t=0;n.dir=1;}
   const x=n.a.x+(n.b.x-n.a.x)*n.t;
   const z=n.a.z+(n.b.z-n.a.z)*n.t;
   n.g.position.set(x,0,z);
   const dx=n.dir>0?(n.b.x-n.a.x):(n.a.x-n.b.x);
   const dz=n.dir>0?(n.b.z-n.a.z):(n.a.z-n.b.z);
   if(Math.abs(dx)+Math.abs(dz)>0.01)n.g.rotation.y=Math.atan2(dx,dz);
  }else{
   n.g.rotation.y=Math.atan2(player.x-n.g.position.x,player.z-n.g.position.z);
  }
  n.g.position.y=Math.abs(Math.sin(ts*0.003))*0.02;
 }
}

function orientFor(n,mk,rot){
 const q=new THREE.Quaternion();
 let dims,halfY;
 if(mk==='stone'){dims=[0.8,0.8,0.8];halfY=0.4;}
 else if(Math.abs(n.y)>0.5){
  if(mk==='brick'){dims=[0.5,0.14,0.25];halfY=0.07;}
  else if(mk==='board'){
   if(rot===0){dims=[2,0.06,0.2];halfY=0.03;}
   else{q.copy(qY90);dims=[0.2,0.06,2];halfY=0.03;}
  }else{dims=[1.4,1.4,0.12];halfY=0.7;}
 }else if(Math.abs(n.x)>Math.abs(n.z)){
  if(mk==='brick'){q.copy(qY90);dims=[0.25,0.14,0.5];halfY=0.07;}
  else if(mk==='board'){q.copy(qY90).multiply(qZ90);dims=[0.06,2,0.2];halfY=1.0;}
  else{q.copy(qY90);dims=[0.12,1.4,1.4];halfY=0.7;}
 }else{
  if(mk==='brick'){dims=[0.5,0.14,0.25];halfY=0.07;}
  else if(mk==='board'){q.copy(qZ90);dims=[0.2,2,0.06];halfY=1.0;}
  else{dims=[1.4,1.4,0.12];halfY=0.7;}
 }
 return{q,dims,halfY};
}

const tmpBox=new THREE.Box3(),tmpBox2=new THREE.Box3();
function computePlacement(){
 ray.setFromCamera(V2,camera);
 const hits=ray.intersectObjects(pickables.concat(pieces.map(p=>p.mesh)),true);
 if(!hits.length)return{ok:false,reason:'Подойди ближе к поверхности'};
 const h=hits[0];
 const ud=h.object.userData;
 let pieceOwner=(()=>{let o=h.object;while(o&&!o.userData.pieceRef)o=o.parent;return o?o.userData.pieceRef:null;})();
 if(ud.city===true||(pieceOwner&&pieceOwner.city))return{ok:false,reason:'На городские постройки ставить нельзя'};
 const surf=ud.ground||ud.plot||pieceOwner;
 if(!surf)return{ok:false,reason:'Ставить можно на землю или на свои материалы'};
 const n=h.face.normal.clone().transformDirection(h.object.matrixWorld);
 const o=orientFor(n,selMat,rotState[selMat]||0);
 const pos=h.point.clone().add(n.clone().multiplyScalar(0.01));
 const ax=Math.abs(n.x)>0.5?'x':(Math.abs(n.y)>0.5?'y':'z');
 pos[ax]+=n[ax]*(o.dims[{x:0,y:1,z:2}[ax]]/2);
 ['x','y','z'].forEach(a=>{if(a!==ax)pos[a]=Math.round(pos[a]*10)/10;});
 tmpBox.setFromCenterAndSize(pos,new THREE.Vector3(o.dims[0],o.dims[1],o.dims[2]));
 tmpBox2.copy(tmpBox).expandByScalar(-0.02);
 for(const s of solids){
  tmpBox2.min.set(s.minX+0.001,s.minY+0.001,s.minZ+0.001);
  tmpBox2.max.set(s.maxX-0.001,s.maxY-0.001,s.maxZ-0.001);
  if(tmpBox.intersectsBox(tmpBox2))return{ok:false,reason:'Здесь уже что-то стоит'};
 }
 if(player.x+R>tmpBox.min.x&&player.x-R<tmpBox.max.x&&player.z+R>tmpBox.min.z&&player.z-R<tmpBox.max.z&&player.y+HGT>tmpBox.min.y&&player.y<tmpBox.max.y)
  return{ok:false,reason:'Слишком близко — отойди'};
 return{ok:true,pos,q:o.q};
}

function loadWorld(){
 try{
  const s=JSON.parse(localStorage.getItem('mg_world')||'null');
  if(s&&s.p&&s.p.length){
   s.p.forEach(a=>{
    const mesh=a.t==='glass'?makeWindow():(a.t==='brick'?makeBrick():(a.t==='stone'?makeStone():makeBoard()));
    mesh.position.set(a.x,a.y,a.z);
    mesh.quaternion.set(a.q[0],a.q[1],a.q[2],a.q[3]);
    scene.add(mesh);
    const b3=new THREE.Box3().setFromObject(mesh);
    const p={t:a.t,mesh,box:{minX:b3.min.x,maxX:b3.max.x,minY:b3.min.y,maxY:b3.max.y,minZ:b3.min.z,maxZ:b3.max.z}};
    mesh.userData.pieceRef=p;pieces.push(p);solids.push(p.box);pickables.push(mesh);
   });
  }
  if(s&&s.i)inv=Object.assign(inv,s.i);
  inv.axe=1;inv.pick=1;
  if(s&&s.tr===1){
   trolleyCarried=true;trolleyWorld.visible=false;
   const si=solids.indexOf(trolleySolid);if(si>=0)solids.splice(si,1);
   heldTrolley.visible=true;
  }
  if(s&&s.pl)player.set(s.pl[0],s.pl[1],s.pl[2]);
  if(s&&s.y!==undefined)yaw=s.y;
  if(s&&s.pt!==undefined)pitch=s.pt;
  return !!(s&&s.p&&s.p.length);
 }catch(e){}
 return false;
}

const R=0.35,HGT=1.7,EYE=1.55,GRAV=20;
const player=new THREE.Vector3(20,0,1);
let yaw=Math.PI*0.9,pitch=-0.05,vy=0,onGround=false,bobT=0;
function resolveCollisions(){
 for(const b of solids){
  if(b.maxY<=player.y+0.5)continue;
  if(player.y+HGT<=b.minY)continue;
  const cx=Math.max(b.minX,Math.min(player.x,b.maxX));
  const cz=Math.max(b.minZ,Math.min(player.z,b.maxZ));
  const dx=player.x-cx,dz=player.z-cz,d2=dx*dx+dz*dz;
  if(d2<R*R){
   if(d2>1e-8){const d=Math.sqrt(d2);player.x=cx+dx/d*R;player.z=cz+dz/d*R;}
   else{
    const ox1=player.x+R-b.minX,ox2=b.maxX-(player.x-R),oz1=player.z+R-b.minZ,oz2=b.maxZ-(player.z-R);
    const m=Math.min(ox1,ox2,oz1,oz2);
    if(m===ox1)player.x=b.minX-R;else if(m===ox2)player.x=b.maxX+R;else if(m===oz1)player.z=b.minZ-R;else player.z=b.maxZ+R;
   }
  }
 }
}
function supportHeight(){
 let s=0;
 for(const b of solids){
  if(player.x+R<=b.minX||player.x-R>=b.maxX||player.z+R<=b.minZ||player.z-R>=b.maxZ)continue;
  if(b.maxY<=player.y+0.5&&b.maxY>s)s=b.maxY;
 }
 return s;
}

let joyPid=null,joyCx=0,joyCy=0;const joyVec={x:0,y:0};
let lookPid=null,lookLast=null,lookMoved=0,lookT0=0;
function joyStart(e){
 joyPid=e.pointerId;
 joyCx=e.clientX;joyCy=e.clientY;
 const el=$('joyL');
 el.style.left=(joyCx-60)+'px';el.style.top=(joyCy-60)+'px';el.style.bottom='auto';
 knobTo(0,0);
}
function knobTo(dx,dy){
 if(dx>44)dx=44;if(dy>44)dy=44;
 if(dx<-44)dx=-44;if(dy<-44)dy=-44;
 $('knob').style.left=(34+dx)+'px';$('knob').style.top=(34+dy)+'px';
}
function joyEnd(){
 joyPid=null;joyVec.x=0;joyVec.y=0;
 const el=$('joyL');
 el.style.left='26px';el.style.top='auto';el.style.bottom='26px';
 $('knob').style.left='34px';$('knob').style.top='34px';
}
renderer.domElement.addEventListener('pointerdown',e=>{
 if(dlgOpen||mapOpen)return;
 if(e.clientX<innerWidth*0.45&&joyPid===null){joyStart(e);}
 else if(lookPid===null){lookPid=e.pointerId;lookLast={x:e.clientX,y:e.clientY};lookMoved=0;lookT0=performance.now();}
 e.preventDefault();
},{passive:false});
renderer.domElement.addEventListener('pointermove',e=>{
 if(e.pointerId===joyPid){
  let dx=e.clientX-joyCx,dy=e.clientY-joyCy;
  const d=Math.hypot(dx,dy);
  if(d>44){dx=dx/d*44;dy=dy/d*44;}
  knobTo(dx,dy);
  joyVec.x=dx/44;joyVec.y=dy/44;
 }else if(e.pointerId===lookPid){
  const dx=e.clientX-lookLast.x,dy=e.clientY-lookLast.y;
  lookMoved+=Math.abs(dx)+Math.abs(dy);
  yaw-=dx*0.0045;pitch-=dy*0.0045;
  pitch=Math.max(-1.45,Math.min(1.45,pitch));
  lookLast={x:e.clientX,y:e.clientY};
 }
},{passive:false});
function ptrEnd(e){
 if(e.pointerId===joyPid)joyEnd();
 if(e.pointerId===lookPid){
  if(lookMoved<14&&performance.now()-lookT0<350)contextAction();

 }
}

let rainOn=false,rainF=0,rainTimer=50,rainDur=0;
const RAIN_N=IS_TOUCH?450:800;
const rainGeo=new THREE.BufferGeometry();
const rainPos=new Float32Array(RAIN_N*3);
for(let i=0;i<RAIN_N;i++){
 rainPos[i*3]=(Math.random()-0.5)*90;
 rainPos[i*3+1]=Math.random()*45;
 rainPos[i*3+2]=(Math.random()-0.5)*90;
}
rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPos,3));
const rain=new THREE.Points(rainGeo,new THREE.PointsMaterial({color:0xa8c8e8,size:0.16,transparent:true,opacity:0}));
rain.visible=false;scene.add(rain);
const rainDim=new THREE.Color(0x5a6472);
function updateWeather(dt){
 rainTimer-=dt;
 if(!rainOn&&rainTimer<=0){
  rainOn=true;rainDur=35+Math.random()*50;rainTimer=rainDur;
  toast('Начинается дождь 🌧');
 }
 if(rainOn){
  rainDur-=dt;
  if(rainDur<=0){rainOn=false;rainTimer=60+Math.random()*90;}
 }
 rainF+=((rainOn?1:0)-rainF)*Math.min(1,dt*1.2);
 rain.visible=rainF>0.05;
 rain.material.opacity=rainF*0.8;
 if(rain.visible){
  const p=rainGeo.attributes.position.array;
  for(let i=0;i<RAIN_N;i++){
   p[i*3+1]-=26*dt;
   p[i*3]+=2.2*dt;
   if(p[i*3+1]<0){p[i*3+1]=40+Math.random()*8;p[i*3]=(Math.random()-0.5)*90;p[i*3+2]=(Math.random()-0.5)*90;}
  }
  rainGeo.attributes.position.needsUpdate=true;
  rain.position.set(player.x,0,player.z);
 }
 if(rainF>0.01){
  const mix=Math.min(0.65,rainF*0.7);
  scene.background.lerp(rainDim,mix*0.15);
  scene.fog.color.copy(scene.background);
  sun.intensity=Math.max(0.1,sun.intensity*(1-mix*0.12));
 }
}

  }
 }
 const nd=nearestNPC();
 if(nd<7){
  npc.rotation.y=Math.atan2(player.x-NPC_POS.x,player.z-NPC_POS.z);
  npc.children[0].position.y=1.05+Math.sin(ts*0.002)*0.015;
 }
 if(Math.hypot(SHOP_NPC.x-player.x,SHOP_NPC.z-player.z)<7){
  shopNpc.rotation.y=Math.atan2(player.x-SHOP_NPC.x,player.z-SHOP_NPC.z);
  shopNpc.children[0].position.y=1.05+Math.sin(ts*0.0021)*0.012;
 }
 if(Math.hypot(PORT_NPC.x-player.x,PORT_NPC.z-player.z)<7){
  portNpc.rotation.y=Math.atan2(player.x-PORT_NPC.x,player.z-PORT_NPC.z);
  portNpc.children[0].position.y=1.05+Math.sin(ts*0.0021)*0.012;
 }
 updateNeighbors(dt,ts);
 /* движение */
 let ix=0,iz=0;
 if(IS_TOUCH){ix=joyVec.x;iz=-joyVec.y;}
 else{
  if(keys.KeyW||keys.ArrowUp)iz+=1;
  if(keys.KeyS||keys.ArrowDown)iz-=1;
  if(keys.KeyA||keys.ArrowLeft)ix-=1;
  if(keys.KeyD||keys.ArrowRight)ix+=1;
  if(!locked){ix=0;iz=0;}
 }
 const mv=Math.hypot(ix,iz);
 if(mv>0.08){
  const s=Math.min(1,mv);
  const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  player.x+=(fx*iz+rx*ix)*s*4.5*dt;
  player.z+=(fz*iz+rz*ix)*s*4.5*dt;
  bobT+=dt*8*s;
 }else bobT+=dt*2;
 vy-=GRAV*dt;player.y+=vy*dt;
 resolveCollisions();
 const sup=supportHeight();
 if(player.y<=sup){player.y=sup;vy=0;onGround=true;}else onGround=false;
 if(keys.Space&&onGround)vy=7.2;
 player.x=Math.max(-240,Math.min(260,player.x));player.z=Math.max(-240,Math.min(260,player.z));
 camera.position.set(player.x,player.y+EYE+Math.sin(bobT)*0.035,player.z);
 camera.rotation.order='YXZ';
 camera.rotation.set(pitch,yaw,0);
 if(heldSwing>0)heldSwing=Math.max(0,heldSwing-dt*2.2);
 const sw=heldSwing>0?Math.sin((0.3-heldSwing)/0.3*Math.PI)*0.7:0;
 const walkSw=Math.sin(bobT)*0.05;
 armR.rotation.x=-0.55-sw*0.9+walkSw;
 armR.position.y=-0.42+Math.abs(Math.sin(bobT))*0.02;
 armL.rotation.x=-0.5-walkSw*0.5;
 armL.position.y=-0.42-Math.abs(Math.sin(bobT))*0.02;
 held.position.set(0.32+Math.sin(bobT)*0.012,-0.36+Math.abs(Math.sin(bobT))*0.02,-0.62+sw*0.15);
 held.rotation.set(0.2-sw*0.8,-0.4,0.08);
 if(carryGroup.visible)carryGroup.position.y=-0.36+Math.abs(Math.sin(bobT))*0.03;
 if(carryStack.visible){
  carryStack.position.set(-0.16,-0.3+Math.abs(Math.sin(bobT))*0.02,-0.62);
  carryStack.rotation.set(0.05,0.3,0);
 }
 updateHint();
 updateHighlight(dt);
 renderer.render(scene,camera);
}
requestAnimationFrame(loop);
</script>
