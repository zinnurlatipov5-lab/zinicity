<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ZINI CITY</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#9ed9ff;font-family:'Segoe UI',system-ui,sans-serif;color:#10202e;touch-action:none;overscroll-behavior:none}
canvas{touch-action:none;display:block}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 58%,rgba(10,16,40,.28) 100%)}
#topbar{position:absolute;top:10px;left:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:70vw}
.chip{background:rgba(10,20,40,.75);color:#eaf4ff;border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:6px 12px;font-size:13px;font-weight:800}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);opacity:.85}
#cross:before,#cross:after{content:'';position:absolute;background:#fff;box-shadow:0 0 3px #000}
#cross:before{left:8px;top:0;width:2px;height:18px}
#cross:after{top:8px;left:0;width:18px;height:2px}
#hotbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto;max-width:96vw;overflow-x:auto}
.hchip{background:rgba(12,22,44,.85);color:#fff;border:2px solid rgba(255,255,255,.25);border-radius:12px;padding:7px 11px;font-size:12px;font-weight:800;cursor:pointer;min-width:76px;text-align:center;flex-shrink:0}
.hchip.on{border-color:#7ef2ff;box-shadow:0 0 12px rgba(126,242,255,.6)}
.hchip .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid rgba(255,255,255,.4)}
.hchip small{display:block;font-size:10px;opacity:.75;font-weight:700}
.abtn{position:absolute;width:60px;height:60px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(16,28,56,.8);color:#fff;font-size:24px;pointer-events:auto;cursor:pointer;touch-action:none}
#actBtn{right:20px;bottom:28px;width:80px;height:80px;font-size:32px}
#modeBtn{right:28px;bottom:124px;width:54px;height:54px;font-size:21px}
#jumpBtn{right:114px;bottom:34px;width:54px;height:54px;font-size:21px}
#rotBtn{right:114px;bottom:106px;width:54px;height:54px;font-size:19px}
#mapBtn{position:absolute;top:10px;right:14px;width:52px;height:52px;border-radius:14px;border:2px solid rgba(255,255,255,.5);background:rgba(16,28,56,.85);color:#fff;font-size:24px;pointer-events:auto;cursor:pointer;touch-action:none}
#joyL{position:absolute;left:26px;bottom:26px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);pointer-events:none}
#knob{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.35);left:34px;top:34px}
#tip{position:absolute;left:12px;bottom:14px;font-size:11px;font-weight:700;color:#fff;background:rgba(10,20,40,.6);border-radius:10px;padding:6px 10px;max-width:44vw;line-height:1.5}
body.touch #tip{display:none}
#lockHint{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(8,14,32,.55);color:#fff;font-size:18px;font-weight:900;pointer-events:auto;cursor:pointer}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tst{background:rgba(14,26,54,.92);color:#eaf4ff;border:1px solid rgba(126,242,255,.5);border-radius:12px;padding:7px 14px;font-size:12.5px;font-weight:800;animation:tt 2.2s ease forwards;max-width:86vw;text-align:center}
@keyframes tt{0%{opacity:0;transform:translateY(8px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#dlg{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(6,12,28,.45);pointer-events:auto;padding-bottom:8vh}
#dlgBox{background:#12244a;border:2px solid #3d5a8a;border-radius:18px;padding:16px;max-width:90vw;max-height:60vh;overflow:auto}
#dlgName{color:#7ef2ff;font-weight:900;font-size:14px;margin-bottom:8px}
#dlgText{color:#eaf4ff;font-size:14px;line-height:1.5;margin-bottom:12px}
#dlgBtns{display:flex;flex-direction:column;gap:8px}
.dbtn{background:#2f6fc0;color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:900;font-size:13px;cursor:pointer;text-align:left}
.dbtn.alt{background:#243a63}
.dbtn:disabled{opacity:.45;cursor:default}
#mapWrap{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(6,12,28,.75);pointer-events:auto}
#mapPanel{background:#10203c;border:2px solid #3d5a8a;border-radius:18px;padding:14px;max-width:92vw}
#mapTitle{color:#d8f6ff;font-weight:900;font-size:15px;text-align:center;margin-bottom:8px}
#mapCv{display:block;border-radius:10px;max-width:86vw;max-height:60vh}
#mapClose{display:block;margin:10px auto 0;background:#2f6fc0;color:#fff;border:0;border-radius:10px;padding:8px 22px;font-weight:900;font-size:14px}
</style>
</head>
<body>
<div id="vignette"></div>
<div id="ui">
 <div id="topbar">
  <div class="chip" id="nick">Новосёл</div>
  <div class="chip" id="moneyChip">💰 500 ₽</div>
  <div class="chip" id="jobChip" style="display:none">📦 0/5 · 2:00</div>
  <div class="chip" id="modeChip">🔨 СТРОЙКА</div>
 </div>
 <div id="cross"></div>
 <div id="hint"></div>
 <div id="hotbar"></div>
 <div id="tip">WASD — ходьба · мышь — обзор · клик/E — действие · Q — режим · R — повернуть · M — карта</div>
</div>
<div id="joyL"><div id="knob"></div></div>
<button class="abtn" id="jumpBtn">⬆</button>
<button class="abtn" id="modeBtn">⚒</button>
<button class="abtn" id="rotBtn">⟳</button>
<button class="abtn" id="actBtn">🔨</button>
<button id="mapBtn">🗺</button>
<div id="toast"></div>
<div id="lockHint">Клик — играть 🖱</div>
<div id="dlg">
 <div id="dlgBox">
  <div id="dlgName">БИРЖА ТРУДА · Тимофей</div>
  <div id="dlgText"></div>
  <div id="dlgBtns"></div>
 </div>
</div>
<div id="mapWrap">
 <div id="mapPanel">
  <div id="mapTitle">КАРТА ZINI CITY</div>
  <canvas id="mapCv" width="340" height="340"></canvas>
  <button id="mapClose">Закрыть</button>
 </div>
</div>
<script>
'use strict';
/* ===== ZINI CITY — Спринт 4: карьера, кирка, камень, кирпичный завод + тач-ввод ===== */
const $=id=>document.getElementById(id);
const IS_TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(IS_TOUCH)document.body.classList.add('touch');
function toast(t){const d=document.createElement('div');d.className='tst';d.textContent=t;$('toast').appendChild(d);setTimeout(()=>d.remove(),2200);}
let errToasted=false;
function errToast(m){if(errToasted)return;errToasted=true;try{toast('Сбой: '+m+' — напиши мне этот текст');}catch(_){}}
window.addEventListener('error',e=>errToast(e.message));
/* --- звук --- */
let ACX=null;
function ac(){try{if(!ACX)ACX=new (window.AudioContext||window.webkitAudioContext)();if(ACX.state==='suspended')ACX.resume();return ACX;}catch(e){return null;}}
function sfx(fr,du,ty,vo){const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.value=fr;g.gain.setValueAtTime(vo,a.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+du);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+du);}catch(e){}}
function thunk(){sfx(140,0.09,'square',0.05);sfx(90,0.12,'sine',0.04);}
function crack(){sfx(260,0.06,'square',0.04);setTimeout(()=>sfx(180,0.09,'square',0.03),40);}
function coin(){sfx(880,0.07,'sine',0.05);setTimeout(()=>sfx(1320,0.1,'sine',0.05),70);}
function chopSfx(){sfx(110,0.14,'square',0.06);setTimeout(()=>sfx(70,0.16,'sine',0.05),60);}
function mineSfx(){sfx(180,0.08,'square',0.05);setTimeout(()=>sfx(120,0.1,'square',0.04),50);}
window.addEventListener('pointerdown',()=>ac());
/* --- деньги и ник --- */
let money=parseInt(localStorage.getItem('mg_money')||'500',10);
function setMoney(v){money=v;localStorage.setItem('mg_money',String(v));$('moneyChip').textContent='💰 '+money+' ₽';}
setMoney(money);
let NICK=localStorage.getItem('mg_nick');
if(!NICK){const v=prompt('Как тебя звать в ZINI CITY?','')||'';NICK=(v.trim()||'Новосёл').slice(0,12);localStorage.setItem('mg_nick',NICK);}
$('nick').textContent=NICK;
/* --- three --- */
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xbfe0f5,90,300);
(function(){
 const c=document.createElement('canvas');c.width=2;c.height=256;const g=c.getContext('2d');
 const gr=g.createLinearGradient(0,0,0,256);
 gr.addColorStop(0,'#4d9be8');gr.addColorStop(0.55,'#9ed3f5');gr.addColorStop(1,'#e8f4fb');
 g.fillStyle=gr;g.fillRect(0,0,2,256);
 scene.background=new THREE.CanvasTexture(c);
})();
const camera=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,0.1,500);
scene.add(camera);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(IS_TOUCH?1.5:2,devicePixelRatio||1));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
scene.add(new THREE.HemisphereLight(0xe8f4ff,0x6a8a52,0.75));
const sun=new THREE.DirectionalLight(0xfff2d8,1.05);
sun.position.set(60,90,30);
sun.castShadow=true;
sun.shadow.mapSize.set(IS_TOUCH?1024:2048,IS_TOUCH?1024:2048);
sun.shadow.camera.left=-110;sun.shadow.camera.right=110;
sun.shadow.camera.top=110;sun.shadow.camera.bottom=-110;
sun.shadow.camera.far=320;
scene.add(sun);
/* ореол солнца */
(function(){
 const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
 const gr=g.createRadialGradient(64,64,4,64,64,64);
 gr.addColorStop(0,'rgba(255,244,200,.9)');gr.addColorStop(0.4,'rgba(255,230,160,.25)');gr.addColorStop(1,'rgba(255,230,160,0)');
 g.fillStyle=gr;g.fillRect(0,0,128,128);
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));
 sp.scale.set(60,60,1);sp.position.set(200,260,100);scene.add(sp);
})();
const solids=[],statics=[],pickables=[],pieces=[];
/* --- текстуры --- */
function makeTex(size,draw){
 const c=document.createElement('canvas');c.width=c.height=size;
 const g=c.getContext('2d');draw(g,size);
 const t=new THREE.CanvasTexture(c);t.anisotropy=4;
 return t;
}
function noise(g,s,n,a){
 for(let i=0;i<n;i++){g.fillStyle='rgba('+(Math.random()<0.5?'0,0,0':'255,255,255')+','+a+')';g.fillRect(Math.random()*s,Math.random()*s,2,2);}
}
function brickFaceMake(base){
 return makeTex(256,(g,s)=>{
  g.fillStyle='#d8d2c6';g.fillRect(0,0,s,s);
  const gr=g.createLinearGradient(0,0,0,s);
  gr.addColorStop(0,base);gr.addColorStop(0.5,'#c05a3a');gr.addColorStop(1,base);
  g.fillStyle=gr;g.fillRect(12,10,s-24,s-20);
  for(let i=0;i<260;i++){
   g.fillStyle='rgba('+(Math.random()<0.5?'60,20,12':'230,150,110')+','+(0.05+Math.random()*0.12).toFixed(2)+')';
   g.fillRect(12+Math.random()*(s-24),10+Math.random()*(s-20),3+Math.random()*5,2+Math.random()*4);
  }
  g.fillStyle='rgba(40,16,10,.4)';
  for(let i=0;i<8;i++)g.fillRect(14+Math.random()*(s-32),12+Math.random()*(s-28),4,2);
  g.fillStyle='rgba(255,220,190,.25)';g.fillRect(12,10,s-24,3);
  g.fillStyle='rgba(0,0,0,.3)';g.fillRect(12,s-16,s-24,6);
 });
}
function brickEndMake(base){
 return makeTex(128,(g,s)=>{
  g.fillStyle='#d8d2c6';g.fillRect(0,0,s,s);
  g.fillStyle=base;g.fillRect(26,22,s-52,s-44);
  const gr=g.createLinearGradient(0,0,0,s);
  gr.addColorStop(0,'rgba(255,255,255,.15)');gr.addColorStop(1,'rgba(0,0,0,.25)');
  g.fillStyle=gr;g.fillRect(26,22,s-52,s-44);
  noise(g,s,90,0.1);
 });
}
const brickBases=['#a8442e','#b0512f','#99402b'];
const brickMatsList=brickBases.map(base=>({
 face:new THREE.MeshStandardMaterial({map:brickFaceMake(base),roughness:0.92}),
 end:new THREE.MeshStandardMaterial({map:brickEndMake(base),roughness:0.92})
}));
const brickBump=makeTex(128,(g,s)=>{
 g.fillStyle='#141414';g.fillRect(0,0,s,s);
 g.fillStyle='rgb(225,225,225)';g.fillRect(6,5,s-12,s-10);
 noise(g,s,120,0.16);
});
function plankFaceMake(){
 return makeTex(256,(g,s)=>{
  g.fillStyle='#8a5f36';g.fillRect(0,0,s,s);
  const kx=s*(0.2+Math.random()*0.6),ky=s*(0.25+Math.random()*0.5);
  for(let k=0;k<28;k++){
   g.strokeStyle='rgba(60,38,18,'+(0.12+Math.random()*0.3).toFixed(2)+')';
   g.lineWidth=1+Math.random()*2;
   const gx=Math.random()*s;
   g.beginPath();g.moveTo(gx,4);
   g.bezierCurveTo(gx+6,s*0.3,gx-6,s*0.7,gx+3,s-4);
   g.stroke();
  }
  g.fillStyle='rgba(255,235,200,.12)';g.fillRect(0,0,s,4);
  g.fillStyle='rgba(40,24,10,.45)';g.fillRect(0,s-5,s,5);
  noise(g,s,130,0.07);
  if(Math.random()<0.75){
   g.strokeStyle='rgba(50,30,14,.6)';g.lineWidth=2;
   g.beginPath();g.ellipse(kx,ky,6+Math.random()*4,9+Math.random()*5,Math.random()*3,0,7);g.stroke();
   g.beginPath();g.ellipse(kx,ky,3,4.5,Math.random(),0,7);g.stroke();
  }
 });
}
const plankSideTex=makeTex(256,(g,s)=>{
 g.fillStyle='#7a5330';g.fillRect(0,0,s,s);
 for(let k=0;k<40;k++){
  g.strokeStyle='rgba(52,32,15,'+(0.15+Math.random()*0.3).toFixed(2)+')';
  g.lineWidth=1+Math.random();
  const gy=Math.random()*s;
  g.beginPath();g.moveTo(0,gy);g.lineTo(s,gy+(Math.random()-0.5)*6);g.stroke();
 }
 noise(g,s,90,0.08);
});
const endGrainTex=makeTex(64,(g,s)=>{
 g.fillStyle='#c8a878';g.fillRect(0,0,s,s);
 for(let r=3;r<s/2;r+=3+Math.random()*3){
  g.strokeStyle='rgba(110,70,35,'+(0.3+Math.random()*0.3).toFixed(2)+')';
  g.lineWidth=1.5;
  g.beginPath();g.arc(s/2,s/2,r,0,7);g.stroke();
 }
 g.strokeStyle='rgba(50,30,14,.7)';g.lineWidth=3;g.strokeRect(1,1,s-2,s-2);
});
const plankBump=makeTex(256,(g,s)=>{
 g.fillStyle='#c8c8c8';g.fillRect(0,0,s,s);
 for(let k=0;k<30;k++){
  g.strokeStyle='rgba(40,40,40,'+(0.25+Math.random()*0.35).toFixed(2)+')';
  g.lineWidth=1+Math.random()*2;
  const gx=Math.random()*s;
  g.beginPath();g.moveTo(gx,2);g.bezierCurveTo(gx+5,s*0.3,gx-5,s*0.7,gx+2,s-2);g.stroke();
 }
 noise(g,s,120,0.12);
});
const frameTex=makeTex(128,(g,s)=>{
 g.fillStyle='#f5f0e6';g.fillRect(0,0,s,s);
 for(let k=0;k<12;k++){
  g.strokeStyle='rgba(120,90,50,'+(0.1+Math.random()*0.2).toFixed(2)+')';
  g.lineWidth=1.5;
  const gx=Math.random()*s;
  g.beginPath();g.moveTo(gx,0);g.lineTo(gx+2,s);g.stroke();
 }
 g.fillStyle='rgba(90,60,30,.35)';g.fillRect(0,s-8,s,8);
});
const frameBump=makeTex(128,(g,s)=>{
 g.fillStyle='#b8b8b8';g.fillRect(0,0,s,s);noise(g,s,90,0.12);
});
/* КАМЕНЬ: цвет + рельеф */
const stoneTex=makeTex(256,(g,s)=>{
 g.fillStyle='#8d9298';g.fillRect(0,0,s,s);
 for(let i=0;i<40;i++){
  g.fillStyle='rgba('+(Math.random()<0.5?'70,74,80':'200,205,210')+','+(0.08+Math.random()*0.15).toFixed(2)+')';
  g.beginPath();g.ellipse(Math.random()*s,Math.random()*s,6+Math.random()*22,4+Math.random()*14,Math.random()*3,0,7);g.fill();
 }
 g.strokeStyle='rgba(50,54,60,.5)';g.lineWidth=3;
 for(let i=0;i<9;i++){
  g.beginPath();g.moveTo(Math.random()*s,Math.random()*s);
  g.lineTo(Math.random()*s,Math.random()*s);g.stroke();
 }
 noise(g,s,200,0.1);
});
const stoneBump=makeTex(256,(g,s)=>{
 g.fillStyle='#808080';g.fillRect(0,0,s,s);
 for(let i=0;i<40;i++){
  g.fillStyle='rgba('+(Math.random()<0.5?'0,0,0':'255,255,255')+','+(0.1+Math.random()*0.2).toFixed(2)+')';
  g.beginPath();g.ellipse(Math.random()*s,Math.random()*s,6+Math.random()*20,4+Math.random()*12,Math.random()*3,0,7);g.fill();
 }
 noise(g,s,220,0.18);
});
const grassTex=makeTex(512,(g,s)=>{
 g.fillStyle='#5c9440';g.fillRect(0,0,s,s);
 for(let i=0;i<420;i++){
  g.fillStyle=Math.random()<0.5?'rgba(70,130,50,.5)':'rgba(110,165,80,.4)';
  g.beginPath();g.ellipse(Math.random()*s,Math.random()*s,6+Math.random()*16,4+Math.random()*10,Math.random()*3,0,7);g.fill();
 }
 for(let i=0;i<2400;i++){
  g.fillStyle=Math.random()<0.5?'#55893a':'#67a04a';
  g.fillRect(Math.random()*s,Math.random()*s,2,3);
 }
 for(let i=0;i<400;i++){
  g.fillStyle=Math.random()<0.5?'rgba(140,190,110,.35)':'rgba(60,110,40,.3)';
  g.fillRect(Math.random()*s,Math.random()*s,1,4+Math.random()*5);
 }
 for(let i=0;i<34;i++){
  g.fillStyle=['#ffd0e8','#fff3a0','#e8c5ff','#ffb0a0'][Math.floor(Math.random()*4)];
  g.beginPath();g.arc(Math.random()*s,Math.random()*s,2.5,0,7);g.fill();
 }
});
const grassBump=makeTex(256,(g,s)=>{
 g.fillStyle='#7a7a7a';g.fillRect(0,0,s,s);
 for(let i=0;i<600;i++){g.fillStyle=Math.random()<0.5?'rgba(0,0,0,.3)':'rgba(255,255,255,.25)';g.fillRect(Math.random()*s,Math.random()*s,2,2);}
});
grassTex.wrapS=grassTex.wrapT=THREE.RepeatWrapping;grassTex.repeat.set(80,80);
grassBump.wrapS=grassBump.wrapT=THREE.RepeatWrapping;grassBump.repeat.set(80,80);
const asphaltTex=makeTex(256,(g,s)=>{
 g.fillStyle='#3a3f46';g.fillRect(0,0,s,s);
 for(let i=0;i<600;i++){g.fillStyle=Math.random()<0.5?'rgba(255,255,255,.06)':'rgba(0,0,0,.25)';g.fillRect(Math.random()*s,Math.random()*s,2,2);}
 for(let i=0;i<24;i++){
  g.fillStyle='rgba(0,0,0,.3)';
  g.beginPath();g.ellipse(Math.random()*s,Math.random()*s,8+Math.random()*16,4+Math.random()*8,Math.random()*3,0,7);g.fill();
 }
});

const geoCache={};
function roundedBox(w,h,d,r){
 const k=w+'_'+h+'_'+d+'_'+r;
 if(geoCache[k])return geoCache[k];
 r=Math.min(r,w/2-0.01,h/2-0.01,d/2-0.01);
 const s=new THREE.Shape(),x=-w/2,y=-h/2;
 s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);
 s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
 s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);
 s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);
 const geo=new THREE.ExtrudeGeometry(s,{depth:d-2*r,bevelEnabled:true,bevelThickness:r,bevelSize:r,bevelSegments:2,curveSegments:4});
 geo.center();geoCache[k]=geo;return geo;
}
const matCache={};
function matOf(hex){
 const k='c'+hex;
 if(matCache[k])return matCache[k];
 const m=new THREE.MeshStandardMaterial({color:hex,roughness:0.85,metalness:0.05,bumpMap:genericBump,bumpScale:0.02});
 matCache[k]=m;return m;
}
function addSolidBox(x,z,w,h,d,color,r){
 const m=new THREE.Mesh(roundedBox(w,h,d,r),matOf(color));

 statics.push(m);pickables.push(m);return m;
}

 g.strokeStyle='#7ef2ff';g.lineWidth=3;g.stroke();
 g.fillStyle='#d8f6ff';g.fillText(text,w/2,33);
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));

}

function orientFor(n,mk,rot){
 const q=new THREE.Quaternion();
 let dims,halfY;
 if(mk==='stone'){dims=[0.8,0.8,0.8];halfY=0.4;}
 else if(Math.abs(n.y)>0.5){
  if(mk==='brick'){dims=[0.5,0.14,0.25];halfY=0.07;}
  else if(mk==='board'){
   if(rot===0){dims=[2,0.06,0.2];halfY=0.03;}
   else{q.copy(qY90);dims=[0.2,0.06,2];halfY=0.03;}
  }else{dims=[1.4,1.4,0.12];halfY=0.7;}
 }else if(Math.abs(n.x)>Math.abs(n.z)){
  if(mk==='brick'){q.copy(qY90);dims=[0.25,0.14,0.5];halfY=0.07;}
  else if(mk==='board'){q.copy(qY90).multiply(qZ90);dims=[0.06,2,0.2];halfY=1.0;}
  else{q.copy(qY90);dims=[0.12,1.4,1.4];halfY=0.7;}
 }else{
  if(mk==='brick'){dims=[0.5,0.14,0.25];halfY=0.07;}
  else if(mk==='board'){q.copy(qZ90);dims=[0.2,2,0.06];halfY=1.0;}
  else{dims=[1.4,1.4,0.12];halfY=0.7;}
 }
 return{q,dims,halfY};
}
const ray=new THREE.Raycaster();ray.far=7;
const V2=new THREE.Vector2(0,0);
const tmpBox=new THREE.Box3(),tmpBox2=new THREE.Box3();
function computePlacement(){
 ray.setFromCamera(V2,camera);
 const hits=ray.intersectObjects(pickables.concat(pieces.map(p=>p.mesh)),true);
 if(!hits.length)return{ok:false,reason:'Подойди ближе к поверхности'};
 const h=hits[0];
 const ud=h.object.userData;
 let pieceOwner=(()=>{let o=h.object;while(o&&!o.userData.pieceRef)o=o.parent;return o?o.userData.pieceRef:null;})();
 if(ud.city===true||(pieceOwner&&pieceOwner.city))return{ok:false,reason:'На городские постройки ставить нельзя'};
 const surf=ud.ground||ud.plot||pieceOwner;
 if(!surf)return{ok:false,reason:'Ставить можно на землю или на свои материалы'};
 const n=h.face.normal.clone().transformDirection(h.object.matrixWorld);
 const o=orientFor(n,selMat,rotState[selMat]||0);
 const pos=h.point.clone().add(n.clone().multiplyScalar(0.01));
 const ax=Math.abs(n.x)>0.5?'x':(Math.abs(n.y)>0.5?'y':'z');
 pos[ax]+=n[ax]*(o.dims[{x:0,y:1,z:2}[ax]]/2);
 ['x','y','z'].forEach(a=>{if(a!==ax)pos[a]=Math.round(pos[a]*10)/10;});
 tmpBox.setFromCenterAndSize(pos,new THREE.Vector3(o.dims[0],o.dims[1],o.dims[2]));
 tmpBox2.copy(tmpBox).expandByScalar(-0.02);
 for(const s of solids){
  tmpBox2.min.set(s.minX+0.001,s.minY+0.001,s.minZ+0.001);
  tmpBox2.max.set(s.maxX-0.001,s.maxY-0.001,s.maxZ-0.001);
  if(tmpBox.intersectsBox(tmpBox2))return{ok:false,reason:'Здесь уже что-то стоит'};
 }
 if(player.x+R>tmpBox.min.x&&player.x-R<tmpBox.max.x&&player.z+R>tmpBox.min.z&&player.z-R<tmpBox.max.z&&player.y+HGT>tmpBox.min.y&&player.y<tmpBox.max.y)
  return{ok:false,reason:'Слишком близко — отойди'};
 return{ok:true,pos,q:o.q};
}

const R=0.35,HGT=1.7,EYE=1.55,GRAV=20;
const player=new THREE.Vector3(20,0,1);
let yaw=Math.PI*0.9,pitch=-0.05,vy=0,onGround=false,bobT=0;
function resolveCollisions(){
 for(const b of solids){
  if(b.maxY<=player.y+0.5)continue;
  if(player.y+HGT<=b.minY)continue;
  const cx=Math.max(b.minX,Math.min(player.x,b.maxX));
  const cz=Math.max(b.minZ,Math.min(player.z,b.maxZ));
  const dx=player.x-cx,dz=player.z-cz,d2=dx*dx+dz*dz;
  if(d2<R*R){
   if(d2>1e-8){const d=Math.sqrt(d2);player.x=cx+dx/d*R;player.z=cz+dz/d*R;}
   else{
    const ox1=player.x+R-b.minX,ox2=b.maxX-(player.x-R),oz1=player.z+R-b.minZ,oz2=b.maxZ-(player.z-R);
    const m=Math.min(ox1,ox2,oz1,oz2);
    if(m===ox1)player.x=b.minX-R;else if(m===ox2)player.x=b.maxX+R;else if(m===oz1)player.z=b.minZ-R;else player.z=b.maxZ+R;
   }
  }
 }
}
function supportHeight(){
 let s=0;
 for(const b of solids){
  if(player.x+R<=b.minX||player.x-R>=b.maxX||player.z+R<=b.minZ||player.z-R>=b.maxZ)continue;
  if(b.maxY<=player.y+0.5&&b.maxY>s)s=b.maxY;
 }
 return s;
}

let joyPid=null,joyCx=0,joyCy=0;const joyVec={x:0,y:0};
let lookPid=null,lookLast=null,lookMoved=0,lookT0=0;
function joyStart(e){
 joyPid=e.pointerId;
 joyCx=e.clientX;joyCy=e.clientY;
 const el=$('joyL');
 el.style.left=(joyCx-60)+'px';el.style.top=(joyCy-60)+'px';el.style.bottom='auto';
 knobTo(0,0);
}
function knobTo(dx,dy){
 if(dx>44){dx=dx/44*44;}
 if(dy>44){dy=dy/44*44;}
 if(dx<-44)dx=-44;if(dy<-44)dy=-44;
 $('knob').style.left=(34+dx)+'px';$('knob').style.top=(34+dy)+'px';
}
function joyEnd(){
 joyPid=null;joyVec.x=0;joyVec.y=0;
 const el=$('joyL');
 el.style.left='26px';el.style.top='auto';el.style.bottom='26px';
 $('knob').style.left='34px';$('knob').style.top='34px';
}
renderer.domElement.addEventListener('pointerdown',e=>{
 if(dlgOpen||mapOpen)return;
 if(e.clientX<innerWidth*0.45&&joyPid===null){joyStart(e);}
 else if(lookPid===null){lookPid=e.pointerId;lookLast={x:e.clientX,y:e.clientY};lookMoved=0;lookT0=performance.now();}
 e.preventDefault();
},{passive:false});
renderer.domElement.addEventListener('pointermove',e=>{
 if(e.pointerId===joyPid){
  let dx=e.clientX-joyCx,dy=e.clientY-joyCy;
  const d=Math.hypot(dx,dy);
  if(d>44){dx=dx/d*44;dy=dy/d*44;}
  knobTo(dx,dy);
  joyVec.x=dx/44;joyVec.y=dy/44;
 }else if(e.pointerId===lookPid){
  const dx=e.clientX-lookLast.x,dy=e.clientY-lookLast.y;
  lookMoved+=Math.abs(dx)+Math.abs(dy);
  yaw-=dx*0.0045;pitch-=dy*0.0045;
  pitch=Math.max(-1.45,Math.min(1.45,pitch));
  lookLast={x:e.clientX,y:e.clientY};
 }
},{passive:false});
function ptrEnd(e){
 if(e.pointerId===joyPid)joyEnd();
 if(e.pointerId===lookPid){
  if(lookMoved<14&&performance.now()-lookT0<350)contextAction();
  lookPid=null;
 }
}

 $('hotbar').innerHTML=PIECE_KEYS.map(k=>'<div class="hchip'+(k===selMat?' on':'')+'" data-k="'+k+'"><span class="sw" style="background:'+PIECES[k].ui+'"></span>'+PIECES[k].n+'<small>'+(PIECES[k].tool?'∞':'×'+inv[k])+'</small></div>').join('');
 document.querySelectorAll('.hchip').forEach(c=>c.onclick=()=>selectMat(c.dataset.k));
}
UIC();
/* --- диалог --- */
let dlgOpen=false,dlgMode='npc';
function openDialog(mode){
 dlgMode=mode||'npc';
 dlgOpen=true;
 $('dlg').style.display='flex';
 if(dlgMode==='npc')$('dlgName').textContent='БИРЖА ТРУДА · Тимофей';
 else $('dlgName').textContent='КИРПИЧНЫЙ ЗАВОД ZINI BRICK';
 renderDialog();
 if(document.pointerLockElement)document.exitPointerLock();
 $('lockHint').style.display='none';
 sfx(500,0.06,'sine',0.04);
}
function closeDialog(){
 dlgOpen=false;
 $('dlg').style.display='none';

}
function renderDialog(){
 const btns=$('dlgBtns');btns.innerHTML='';
 if(dlgMode==='plant'){
  $('dlgText').textContent='Печь горит! Приноси камень из карьера — обожжём в кирпич. 3 камня = 5 кирпичей. У тебя камня: '+inv.stone+'.';
  const b=document.createElement('button');b.className='dbtn';b.textContent='Обжечь 3 камня → 5 кирпичей';
  b.disabled=inv.stone<3;
  b.onclick=()=>{
   inv.stone-=3;inv.brick+=5;
   saveMoneyAndInv();coin();UIC();sfx(320,0.25,'sawtooth',0.04);
   toast('Готово: +5 кирпичей! 🧱');
   renderDialog();
  };
  btns.appendChild(b);
 }else if(jobActive){
  $('dlgText').textContent='Смена идёт! Осталось ящиков: '+boxesLeft+'. Носи их к зелёному кольцу у остановки.';
  const b=document.createElement('button');b.className='dbtn alt';b.textContent='Завершить смену досрочно';b.onclick=()=>{closeDialog();endJob(false);};btns.appendChild(b);
 }else{
  $('dlgText').textContent='Здравствуй, '+NICK+'! Смена грузчика: 5 ящиков — 30 ₽ за ящик и 50 ₽ бонуса. Дальше по бизнесу: на восток у дороги — карьера (кирка в наборе ⛏), а у общежития — кирпичный завод: камень в кирпич.';
  const b=document.createElement('button');b.className='dbtn';b.textContent='Устроиться на смену (+30 ₽/ящик)';b.onclick=()=>{closeDialog();startJob();};btns.appendChild(b);
 }
 const c=document.createElement('button');c.className='dbtn alt';c.textContent='Закрыть';c.onclick=closeDialog;btns.appendChild(c);
}
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))closeDialog();});
function saveMoneyAndInv(){try{localStorage.setItem('mg_money',String(money));}catch(e){}}
/* --- действия --- */
const hi=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1,1,1)),new THREE.LineBasicMaterial({color:0x7ef2ff}));
hi.visible=false;scene.add(hi);
function contextAction(){
 heldSwing=0.3;
 if(nearestNPC()<3){openDialog('npc');return;}
 if(Math.hypot(PLANT_POS.x-player.x,(PLANT_POS.z+1.5)-player.z)<3.2){openDialog('plant');return;}
 if(jobActive){
  if(carrying){
   if(Math.hypot(ZONE.x-player.x,ZONE.z-player.z)<2.6)deliverBox();
   else toast('Неси ящик к зелёному кольцу 📦');
   return;
  }
  const b=nearestJobBox();
  if(b){carrying=b;scene.remove(b);carryGroup.visible=true;held.visible=false;sfx(200,0.08,'sine',0.04);return;}
  toast('Ящики у общежития — осталось '+boxesLeft);
  return;
 }
 const lt=nearestLandedTree();
 if(lt){collectTree(lt);return;}
 if(selMat==='axe'){tryChop();return;}
 if(selMat==='pick'){tryMine();return;}
 if(mode==='build')placePiece();else breakPiece();
}
function deliverBox(){
 carrying=null;carryGroup.visible=false;held.visible=true;
 setMoney(money+30);coin();
 boxesLeft--;
 if(boxesLeft<=0)endJob(true);
 else{updateJobChip();toast('+30 ₽! Осталось ящиков: '+boxesLeft);}
}
function nearestNPC(){return player.distanceTo(NPC_POS);}
function nearestJobBox(){
 let best=null,bd=2.4;
 for(const b of jobBoxes){
  const d=Math.hypot(b.position.x-player.x,b.position.z-player.z);
  if(d<bd){bd=d;best=b;}
 }
 return best;
}
function placePiece(){
 if(selMat==='axe'||selMat==='pick'){toast('Инструментом не строят — выбери материал');return;}
 const c=computePlacement();
 if(!c.ok){toast(c.reason);sfx(220,0.1,'square',0.04);return;}
 if(inv[selMat]<=0){toast(PIECES[selMat].n+' закончился');return;}
 inv[selMat]--;
 spawnPiece(selMat,c.pos,c.q);
 thunk();UIC();
}
function breakPiece(){
 if(selMat==='axe'||selMat==='pick'){toast('Инструментом можно добывать только природное');return;}
 ray.setFromCamera(V2,camera);
 const hits=ray.intersectObjects(pieces.map(p=>p.mesh),true);
 if(!hits.length){toast('Тут ломать нечего (город не трогаем 🙂)');return;}
 let o=hits[0].object;while(o&&!o.userData.pieceRef)o=o.parent;
 if(!o||!o.userData.pieceRef)return;
 const p=o.userData.pieceRef;
 inv[p.t]=(inv[p.t]||0)+1;
 removePiece(p);crack();UIC();
}
/* призраки */
const ghost={brick:makeBrick(),board:makeBoard(),glass:makeWindow(),stone:makeStone()};
Object.keys(ghost).forEach(k=>{
 ghost[k].traverse(o=>{if(o.isMesh){if(Array.isArray(o.material))o.material=o.material.map(m=>m.clone());else o.material=o.material.clone();o.material.transparent=true;o.material.opacity=0.35;o.castShadow=false;o.receiveShadow=false;}});
 ghost[k].visible=false;scene.add(ghost[k]);
});
let hlT=0;
function updateHighlight(dt){
 hlT-=dt;
 if(hlT>0)return;
 hlT=0.12;
 Object.keys(ghost).forEach(k=>ghost[k].visible=false);
 hi.visible=false;
 if(carrying||jobActive)return;
 if((selMat==='axe'||selMat==='pick')&&mode==='build'){
  const target=selMat==='axe'?chopTrees.filter(t=>!t.falling).map(t=>t.trunk):rocks.map(r=>r.m);
  const prop=selMat==='axe'?'chop':'rock';
  ray.setFromCamera(V2,camera);
  const hits=ray.intersectObjects(target,false);
  if(hits.length&&hits[0].distance<4.5){
   const obj=hits[0].object.userData[prop];
   const g=obj.g;
   const b3=new THREE.Box3().setFromObject(g);
   const sz=b3.getSize(new THREE.Vector3()),ct=b3.getCenter(new THREE.Vector3());
   hi.position.copy(ct);hi.scale.set(sz.x+0.05,sz.y+0.05,sz.z+0.05);hi.visible=true;
  }
  return;
 }
 if(mode==='build'){
  const c=computePlacement();
  if(c.ok){
   const g=ghost[selMat];
   g.position.copy(c.pos);
   if(c.q)g.quaternion.copy(c.q);else g.quaternion.identity();
   g.visible=true;
  }
 }else{
  ray.setFromCamera(V2,camera);
  const hits=ray.intersectObjects(pieces.map(p=>p.mesh),true);
  if(hits.length){
   let o=hits[0].object;while(o&&!o.userData.pieceRef)o=o.parent;
   if(o&&o.userData.pieceRef){
    const b3=new THREE.Box3().setFromObject(o.userData.pieceRef.mesh);
    const sz=b3.getSize(new THREE.Vector3()),ct=b3.getCenter(new THREE.Vector3());
    hi.position.copy(ct);hi.scale.set(sz.x+0.02,sz.y+0.02,sz.z+0.02);hi.visible=true;
   }
  }
 }
}
/* --- РУКИ ИГРОКА --- */
function makeArm(sleeveHex){
 const g=new THREE.Group();
 const sleeve=new THREE.Mesh(new THREE.CylinderGeometry(0.085,0.07,0.4,8),matOf(sleeveHex));
 sleeve.rotation.x=Math.PI/2;sleeve.position.z=-0.2;g.add(sleeve);
 const fore=new THREE.Mesh(new THREE.CylinderGeometry(0.058,0.05,0.2,8),skinMat);
 fore.rotation.x=Math.PI/2;fore.position.z=-0.48;g.add(fore);
 const hand=new THREE.Mesh(new THREE.SphereGeometry(0.08,10,8),skinMat);
 hand.position.z=-0.6;hand.scale.set(1,0.8,1.15);g.add(hand);
 g.traverse(o=>{if(o.isMesh)o.castShadow=false;});
 return g;
}
const armR=makeArm(0x2f6fc0),armL=makeArm(0x2f6fc0);
armR.position.set(0.3,-0.42,-0.28);armR.rotation.set(-0.55,-0.3,0.12);
armL.position.set(-0.3,-0.42,-0.28);armL.rotation.set(-0.5,0.3,-0.12);
camera.add(armR);camera.add(armL);
/* --- предмет в руке --- */
function makeToolMesh(kind){
 const g=new THREE.Group();
 const handle=new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.028,0.55,7),matOf(0x7a5330));
 handle.rotation.x=Math.PI/2;handle.position.set(0,0.05,-0.28);g.add(handle);
 if(kind==='axe'){
  const head=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.16,0.09),matOf(0xb8c0c8));
  head.position.set(0,0.09,-0.52);g.add(head);
  const blade=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.16,4),matOf(0xd8e0e8));
  blade.rotation.x=Math.PI/2;blade.rotation.z=Math.PI/4;blade.position.set(0,0.09,-0.62);g.add(blade);
 }else{
  const head=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.05,0.06),matOf(0x9aa2aa));
  head.position.set(0,0.1,-0.5);g.add(head);
  [-1,1].forEach(s=>{
   const spike=new THREE.Mesh(new THREE.ConeGeometry(0.045,0.1,5),matOf(0xd8e0e8));
   spike.position.set(s*0.09,0.1,-0.5);
   spike.rotation.z=-s*Math.PI/2;
   g.add(spike);
  });
 }
 g.traverse(o=>{if(o.isMesh)o.castShadow=false;});
 return g;
}
const held=new THREE.Group();
const heldBrick=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.09,0.16),brickMatsArr());
const heldBoard=new THREE.Mesh(new THREE.BoxGeometry(0.55,0.055,0.1),boardFaceMats[0]);
const heldWindow=makeWindow();heldWindow.scale.setScalar(0.22);
heldWindow.traverse(o=>{if(o.isMesh)o.castShadow=false;});
const heldAxe=makeToolMesh('axe');
const heldPick=makeToolMesh('pick');
const heldStone=makeStone();heldStone.scale.setScalar(0.55);heldStone.castShadow=false;
held.add(heldBrick,heldBoard,heldWindow,heldAxe,heldPick,heldStone);
held.position.set(0.32,-0.36,-0.62);
held.rotation.set(0.2,-0.4,0.08);
camera.add(held);
let heldSwing=0;
function updateHeld(){
 heldBrick.visible=selMat==='brick';
 heldBoard.visible=selMat==='board';
 heldWindow.visible=selMat==='glass';
 heldAxe.visible=selMat==='axe';
 heldPick.visible=selMat==='pick';
 heldStone.visible=selMat==='stone';
}
updateHeld();
/* --- подсказка --- */
const hintEl=$('hint');
hintEl.style.cssText='position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:rgba(46,227,139,.92);color:#06251a;border-radius:12px;padding:7px 14px;font-size:12.5px;font-weight:900;display:none;pointer-events:none';
function updateHint(){
 let t='';
 if(nearestNPC()<3)t='Действие — поговорить с Тимофеем';
 else if(Math.hypot(PLANT_POS.x-player.x,(PLANT_POS.z+1.5)-player.z)<3.2)t='Действие — кирпичный завод (камень → кирпич)';
 else if(jobActive){
  if(carrying){
   t=Math.hypot(ZONE.x-player.x,ZONE.z-player.z)<2.6?'Действие — сдать ящик (+30 ₽)':'Неси ящик к зелёному кольцу';
  }else if(nearestJobBox())t='Действие — взять ящик';
  else t='Ящики у общежития — осталось '+boxesLeft;
 }else{
  const lt=nearestLandedTree();
  if(lt)t='Действие — собрать доски (+6)';
 }
 hintEl.style.display=t?'block':'none';
 if(t)hintEl.textContent=t;
}
/* --- карта --- */
const mapCv=$('mapCv'),mg=mapCv.getContext('2d');
let mapOpen=false;
function toggleMap(){
 mapOpen=!mapOpen;
 $('mapWrap').style.display=mapOpen?'flex':'none';
 if(mapOpen){drawMap();sfx(660,0.08,'sine',0.04);}
}
function drawMap(){
 const S=mapCv.width,R2=70;
 const sc=S/(2*R2);
 const px=x=>(x+R2)*sc,pz=z=>(z+R2)*sc;
 mg.fillStyle='#4a7a35';mg.fillRect(0,0,S,S);
 mg.fillStyle='#5c8a3c';
 for(let i=0;i<40;i++){mg.beginPath();mg.arc(Math.random()*S,Math.random()*S,4+Math.random()*10,0,7);mg.fill();}
 mg.fillStyle='#3a3f46';
 mg.fillRect(0,pz(-3),S,6*sc);
 mg.fillRect(px(-2),pz(4),4*sc,28*sc);
 mg.fillStyle='#8a6b42';
 mg.fillRect(px(-64),pz(7),18*sc,3.2*sc);
 mg.fillRect(px(-72),pz(8),3.2*sc,24*sc);
 mg.fillRect(px(55),pz(-11.5),30*sc,3.5*sc);
 mg.fillStyle='#f0f0e0';
 for(let x=-64;x<=64;x+=8)mg.fillRect(px(x),pz(-0.2),2*sc,0.4*sc);
 mg.fillStyle='#cfd4da';mg.fillRect(px(-25),pz(-15),10*sc,8*sc);
 mg.fillStyle='#b55b3c';mg.fillRect(px(-6),pz(-15.5),12*sc,9*sc);
 mg.fillStyle='#9a5f3f';mg.fillRect(px(10),pz(-19),8*sc,5*sc);
 mg.fillStyle='#5a6270';mg.fillRect(px(18),pz(-4.6),4*sc,2.4*sc);
 mg.fillStyle='#7fae57';mg.fillRect(px(-6),pz(24),12*sc,12*sc);
 mg.fillStyle='#2f6b2a';
 [[30,8],[34,-6],[-30,10],[-34,-4],[26,-14],[-26,16],[-32,24],[30,26]].forEach(p=>{mg.beginPath();mg.arc(px(p[0]),pz(p[1]),3,0,7);mg.fill();});
 FOREST_SPOTS.forEach(p=>{mg.beginPath();mg.arc(px(p[0]),pz(p[1]),4,0,7);mg.fill();});
 mg.fillStyle='#8d9298';
 ROCK_SPOTS.forEach(p=>{mg.beginPath();mg.arc(px(p[0]),pz(p[1]),4,0,7);mg.fill();});
 mg.font='bold 10px sans-serif';mg.textAlign='center';
 mg.fillStyle='#fff';
 mg.fillText('МЭРИЯ · БИРЖА',px(-20),pz(-11)+3);
 mg.fillText('ОБЩЕЖИТИЕ',px(0),pz(-11)+14);
 mg.fillText('АВТОВОКЗАЛ',px(20),pz(-3.4)+3);
 mg.fillText('УЧАСТОК',px(0),pz(30)+3);
 mg.fillStyle='#2ee38b';
 mg.fillText('СДАЧА ГРУЗА',px(ZONE.x),pz(ZONE.z)+3);
 mg.fillStyle='#c8ffb0';
 mg.fillText('ЛЕС 🪓',px(-92),pz(20)+3);
 mg.fillStyle='#ffe0a0';
 mg.fillText('ЗАВОД 🧱',px(14),pz(-15)+3);
 mg.fillText('КАРЬЕРА ⛏',px(80),pz(-10)+3);
 mg.fillStyle='#ffd86b';mg.font='bold 12px sans-serif';
 mg.fillText('ZINI CITY',px(0),pz(-26));
 const mx=Math.max(8,Math.min(S-8,px(player.x))),mz=Math.max(8,Math.min(S-8,pz(player.z)));
 mg.save();
 mg.translate(mx,mz);
 mg.rotate(-yaw);
 mg.fillStyle='#2ee38b';mg.strokeStyle='#0b2218';mg.lineWidth=2;
 mg.beginPath();mg.moveTo(0,-9);mg.lineTo(6,7);mg.lineTo(-6,7);mg.closePath();mg.fill();mg.stroke();
 mg.restore();
}
/* --- старт --- */
const hadSave=loadWorld();
if(!hadSave)toast('ZINI CITY! Тимофей — работа, на востоке карьера ⛏, у общежития — завод 🧱');
/* --- цикл --- */
let lastTs=0;
function loop(ts){
 requestAnimationFrame(loop);
 const dt=Math.min(0.033,(ts-lastTs)/1000||0.016);lastTs=ts;
 if(jobActive&&!dlgOpen){
  jobTime-=dt;
  if(jobTime<=0){jobTime=0;endJob(false);}
  updateJobChip();
  const pu=1+Math.sin(ts*0.004)*0.06;
  zoneRing.scale.set(pu,pu,1);
 }
 /* огонь и дым завода */
 const fu=1+Math.sin(ts*0.006)*0.15;
 fire.scale.set(0.95+Math.random()*0.1,fu,1);
 fireLight.intensity=0.6+Math.random()*0.25;
 for(const s of smoke){
  s.p+=dt*0.12;
  if(s.p>1)s.p=0;
  s.m.position.set(17+Math.sin(ts*0.001+s.p*9)*0.6,7+s.p*7,-17);
  s.m.material.opacity=0.5*(1-s.p);
  const sc2=0.5+s.p*1.4;
  s.m.scale.set(sc2,sc2,sc2);
 }
 /* деревья */
 for(const t of chopTrees){
  if(t.falling&&!t.landed){
   t.fallP=Math.min(1,t.fallP+dt*0.8);
   t.g.quaternion.setFromAxisAngle(t.axis,t.fallP*1.5);
   if(t.fallP>=1){t.landed=true;t.g.position.y=0.25;}
  }
  if(t.shake>0){
   t.shake=Math.max(0,t.shake-dt);
   t.trunk.position.x=Math.sin(ts*0.05)*0.04*t.shake*3;
  }
 }
 /* валуны */
 for(const r of rocks){
  if(r.shake>0){
   r.shake=Math.max(0,r.shake-dt);
   r.m.rotation.z=Math.sin(ts*0.06)*0.06*r.shake*3;
  }
 }
 /* НПС */
 const nd=nearestNPC();
 if(nd<7){
  npc.rotation.y=Math.atan2(player.x-NPC_POS.x,player.z-NPC_POS.z);
  nBody.position.y=1.06+Math.sin(ts*0.002)*0.015;
 }
 /* движение */
 let ix=0,iz=0;
 if(IS_TOUCH){ix=joyVec.x;iz=-joyVec.y;}
 else{
  if(keys.KeyW||keys.ArrowUp)iz+=1;
  if(keys.KeyS||keys.ArrowDown)iz-=1;
  if(keys.KeyA||keys.ArrowLeft)ix-=1;
  if(keys.KeyD||keys.ArrowRight)ix+=1;
  if(!locked){ix=0;iz=0;}
 }
 const mv=Math.hypot(ix,iz);
 if(mv>0.08){
  const s=Math.min(1,mv);
  const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  player.x+=(fx*iz+rx*ix)*s*4.5*dt;
  player.z+=(fz*iz+rz*ix)*s*4.5*dt;
  bobT+=dt*8*s;
 }else bobT+=dt*2;
 vy-=GRAV*dt;player.y+=vy*dt;
 resolveCollisions();
 const sup=supportHeight();
 if(player.y<=sup){player.y=sup;vy=0;onGround=true;}else onGround=false;
 if(keys.Space&&onGround)vy=7.2;
 player.x=Math.max(-240,Math.min(240,player.x));player.z=Math.max(-240,Math.min(240,player.z));
 camera.position.set(player.x,player.y+EYE+Math.sin(bobT)*0.035,player.z);
 camera.rotation.order='YXZ';
 camera.rotation.set(pitch,yaw,0);
 /* руки */
 if(heldSwing>0)heldSwing=Math.max(0,heldSwing-dt*2.2);
 const sw=heldSwing>0?Math.sin((0.3-heldSwing)/0.3*Math.PI)*0.7:0;
 const walkSw=Math.sin(bobT)*0.05;
 armR.rotation.x=-0.55-sw*0.9+walkSw;
 armR.position.y=-0.42+Math.abs(Math.sin(bobT))*0.02;
 armL.rotation.x=-0.5-walkSw*0.5;
 armL.position.y=-0.42-Math.abs(Math.sin(bobT))*0.02;
 held.position.set(0.32+Math.sin(bobT)*0.012,-0.36+Math.abs(Math.sin(bobT))*0.02,-0.62+sw*0.15);
 held.rotation.set(0.2-sw*0.8,-0.4,0.08);
 if(carryGroup.visible)carryGroup.position.y=-0.36+Math.abs(Math.sin(bobT))*0.03;
 updateHint();
 updateHighlight(dt);
 renderer.render(scene,camera);
}
requestAnimationFrame(loop);
</script>
